name: 세계수 자동 배포

on:
  push:
    branches:
      - main
    paths:
      - 'REVV_guide.html'   # 이 파일이 바뀔 때만 실행
  workflow_dispatch:        # GitHub 웹에서 수동 실행 가능

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: REVV_guide.html → 배포 폴더로 복사
        run: |
          mkdir -p .guide-hosting/public
          cp REVV_guide.html .guide-hosting/public/index.html
          echo '{"hosting":{"public":"public","ignore":["firebase.json","**/.*"],"site":"revv-eb7c9"}}' > .guide-hosting/firebase.json

      - name: firebase-tools 설치
        run: npm install -g firebase-tools

      - name: 서비스 계정 키 파일 생성
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json

      - name: Firebase Hosting 배포
        run: firebase deploy --only hosting --project revv-eb7c9
        working-directory: .guide-hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
